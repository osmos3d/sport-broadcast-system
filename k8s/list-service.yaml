
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skiing-list
  namespace: sports-broadcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skiing-list
  template:
    metadata:
      labels:
        app: skiing-list
    spec:
      containers:
        - name: skiing-list
          image: skiing-list:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 7000
          env:
            - name: VMIX_IP
              value: "vmix-mock"
            - name: SERVER_IP
              value: "http://skiing-server:3000"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 7000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---       
apiVersion: v1
kind: Service
metadata:
  name: skiing-list
  namespace: sports-broadcast
spec:
  type: ClusterIP
  selector:
    app: skiing-list
  ports:
    - port: 7000
      targetPort: 7000
      protocol: TCP
