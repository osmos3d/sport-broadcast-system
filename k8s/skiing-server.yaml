
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skiing-server
  namespace: sports-broadcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skiing-server
  template:
    metadata:
      labels:
        app: skiing-server
    spec:
      containers:
        - name: skiing-server
          image: skiing-server:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: VMIX_IP
              value: "vmix-mock"
            - name: EVID
              value: "9296"
---
apiVersion: v1
kind: Service
metadata:
  name: skiing-server
  namespace: sports-broadcast
spec:
  type: ClusterIP
  selector:
    app: skiing-server
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
