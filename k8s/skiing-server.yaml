
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skiing-server
  namespace: sports-broadcast
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skiing-server
  template:
    metadata:
      labels:
        app: skiing-server
    spec:
      containers:
        - name: skiing-server
          image: skiing-server:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: VMIX_IP
              value: "vmix-mock"
            - name: EVID
              value: "9298"
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skiing-server
  namespace: sports-broadcast
spec:
  type: ClusterIP
  selector:
    app: skiing-server
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
